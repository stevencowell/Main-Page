<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">A dimensioned practice drawing</title><desc id="desc">A 100 mm square with a central 30 mm diameter hole. Centre lines cross 50 mm from each edge. A radius reaches halfway across the diameter.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#173442" stroke-width="1.6"/></marker></defs><rect width="1400" height="820" fill="#fffdf7"/><text x="65" y="66" font-family="Arial,sans-serif" font-size="38" text-anchor="start" fill="#173442">A dimensioned practice drawing</text><rect x="180" y="190" width="400" height="400" fill="#e4f0f5" stroke="#173442" stroke-width="4"/><circle cx="380" cy="390" r="60" fill="#fffdf7" stroke="#173442" stroke-width="4"/><line x1="160" y1="390" x2="600" y2="390" stroke="#2f6079" stroke-width="1.5" stroke-dasharray="12 8" /><line x1="380" y1="165" x2="380" y2="615" stroke="#2f6079" stroke-width="1.5" stroke-dasharray="12 8" /><line x1="180" y1="175" x2="180" y2="120" stroke="#173442" stroke-width="2" /><line x1="580" y1="175" x2="580" y2="120" stroke="#173442" stroke-width="2" /><line x1="180" y1="140" x2="580" y2="140" stroke="#173442" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="380" y="122" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" fill="#173442">100 mm</text><line x1="165" y1="190" x2="100" y2="190" stroke="#173442" stroke-width="2" /><line x1="165" y1="590" x2="100" y2="590" stroke="#173442" stroke-width="2" /><line x1="120" y1="190" x2="120" y2="590" stroke="#173442" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="88" y="395" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" fill="#173442">100</text><line x1="440" y1="390" x2="730" y2="290" stroke="#b24732" stroke-width="2" /><text x="754" y="290" font-family="Arial,sans-serif" font-size="38" text-anchor="start" fill="#173442">Ø30 mm</text><text x="754" y="338" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173442">Diameter across the whole circle</text><line x1="380" y1="390" x2="440" y2="390" stroke="#b24732" stroke-width="3" /><text x="754" y="426" font-family="Arial,sans-serif" font-size="32" text-anchor="start" fill="#173442">Radius = 15 mm</text><text x="754" y="472" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173442">Centre to the circle edge</text><text x="180" y="678" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173442">The hole centre is 50 mm from each square edge.</text><text x="180" y="724" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173442">Dimension values describe the drawing; screen size does not.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">Cut-out letters need connected material</title><desc id="desc">Two stencil-like O shapes in plates. On the left the central disc is disconnected. On the right solid horizontal bridges connect the disc to the surrounding plate. No bridge width is specified.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#173442" stroke-width="1.6"/></marker></defs><rect width="1400" height="820" fill="#fffdf7"/><text x="65" y="66" font-family="Arial,sans-serif" font-size="38" text-anchor="start" fill="#173442">Cut-out letters need connected material</text><rect x="150" y="200" width="420" height="420" rx="18" fill="#2f6079"/><circle cx="360" cy="410" r="135" fill="#fffdf7"/><circle cx="360" cy="410" r="85" fill="#2f6079"/><text x="360" y="164" font-family="Arial,sans-serif" font-size="29" text-anchor="middle" fill="#173442">Unconnected centre</text><text x="360" y="678" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#173442">The centre has no material connection.</text><rect x="820" y="200" width="420" height="420" rx="18" fill="#2f6079"/><circle cx="1030" cy="410" r="135" fill="#fffdf7"/><circle cx="1030" cy="410" r="85" fill="#2f6079"/><rect x="880" y="392" width="300" height="36" fill="#2f6079"/><text x="1030" y="164" font-family="Arial,sans-serif" font-size="29" text-anchor="middle" fill="#173442">Centre retained by bridges</text><text x="1030" y="678" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#173442">Solid material connects the centre.</text><text x="150" y="755" font-family="Arial,sans-serif" font-size="25" text-anchor="start" fill="#173442">Stencil concept only. Bridge dimensions depend on the approved process.</text></svg>
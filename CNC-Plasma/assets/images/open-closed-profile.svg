<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">A small gap changes the profile</title><desc id="desc">Two rectangular line profiles. The left has a visibly highlighted gap between its upper-right endpoints. The right joins every endpoint into a closed loop.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#173442" stroke-width="1.6"/></marker></defs><rect width="1400" height="820" fill="#fffdf7"/><text x="65" y="66" font-family="Arial,sans-serif" font-size="38" text-anchor="start" fill="#173442">A small gap changes the profile</text><path d="M480 270 H160 V600 H510 V270 " fill="none" stroke="#173442" stroke-width="6"/><text x="335" y="185" font-family="Arial,sans-serif" font-size="34" text-anchor="middle" fill="#173442">Open profile</text><circle cx="496" cy="270" r="43" fill="none" stroke="#b24732" stroke-width="3"/><line x1="508" y1="227" x2="635" y2="180" stroke="#b24732" stroke-width="2" /><text x="580" y="144" font-family="Arial,sans-serif" font-size="27" text-anchor="start" fill="#b24732">Gap</text><path d="M1160 270 H840 V600 H1190 V270 H1160" fill="none" stroke="#173442" stroke-width="6"/><text x="1015" y="185" font-family="Arial,sans-serif" font-size="34" text-anchor="middle" fill="#173442">Closed profile</text><text x="160" y="715" font-family="Arial,sans-serif" font-size="27" text-anchor="start" fill="#173442">An outline can look almost complete while its endpoints remain separate.</text><text x="160" y="765" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173442">Check the geometry in CAD and again after the DXF transfer.</text></svg>
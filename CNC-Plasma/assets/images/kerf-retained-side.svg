<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">The tool centre follows the waste side</title><desc id="desc">A retained rectangular part surrounds a circular hole. The dashed tool centreline runs outside the outer boundary and inside the hole boundary, on the waste side in both cases. Offsets are exaggerated and have no prescribed cutting value.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#173442" stroke-width="1.6"/></marker></defs><rect width="1400" height="820" fill="#fffdf7"/><text x="65" y="66" font-family="Arial,sans-serif" font-size="38" text-anchor="start" fill="#173442">The tool centre follows the waste side</text><path d="M270 160 H810 V650 H270 Z M660 405 A120 120 0 1 0 420 405 A120 120 0 1 0 660 405 Z" fill="#e4f0f5" fill-rule="evenodd" stroke="#173442" stroke-width="4"/><rect x="252" y="142" width="576" height="526" fill="none" stroke="#b24732" stroke-width="5" stroke-dasharray="15 9"/><circle cx="540" cy="405" r="102" fill="none" stroke="#b24732" stroke-width="5" stroke-dasharray="15 9"/><text x="540" y="550" font-family="Arial,sans-serif" font-size="30" text-anchor="middle" fill="#173442">Retained part</text><text x="540" y="405" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#173442">Hole waste</text><line x1="828" y1="215" x2="1000" y2="215" stroke="#b24732" stroke-width="2" /><text x="1020" y="212" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173442">Outside contour</text><text x="1020" y="253" font-family="Arial,sans-serif" font-size="24" text-anchor="start" fill="#173442">Centreline in waste</text><line x1="642" y1="405" x2="968" y2="370" stroke="#b24732" stroke-width="2" /><text x="988" y="370" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173442">Inside contour</text><text x="988" y="411" font-family="Arial,sans-serif" font-size="24" text-anchor="start" fill="#173442">Centreline in hole</text><text x="270" y="733" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173442">Solid outline: nominal edge; dashed line: tool centre</text><text x="270" y="778" font-family="Arial,sans-serif" font-size="24" text-anchor="start" fill="#173442">Offsets exaggerated. Use the validated kerf method and recipe.</text></svg>
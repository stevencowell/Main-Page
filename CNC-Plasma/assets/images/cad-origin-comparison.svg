<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">Different CAD origins, equal dimensions</title><desc id="desc">Two identical 100 mm squares and 30 mm circles. The left origin lies at the centre; its coordinate limits are minus 50 to plus 50. The right origin is at the lower-left corner; the circle centre is 50,50.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#173442" stroke-width="1.6"/></marker></defs><rect width="1400" height="820" fill="#fffdf7"/><text x="65" y="66" font-family="Arial,sans-serif" font-size="38" text-anchor="start" fill="#173442">Different CAD origins, equal dimensions</text><rect x="160" y="210" width="400" height="400" fill="#e4f0f5" stroke="#173442" stroke-width="4"/><circle cx="360" cy="410" r="60" fill="#fffdf7" stroke="#173442" stroke-width="4"/><line x1="315" y1="410" x2="460" y2="410" stroke="#b24732" stroke-width="3" /><line x1="360" y1="455" x2="360" y2="310" stroke="#b24732" stroke-width="3" /><text x="467" y="418" font-family="Arial,sans-serif" font-size="22" text-anchor="start" fill="#b24732">X</text><text x="354" y="298" font-family="Arial,sans-serif" font-size="22" text-anchor="start" fill="#b24732">Y</text><text x="360" y="154" font-family="Arial,sans-serif" font-size="32" text-anchor="middle" fill="#173442">Centre origin</text><text x="360" y="677" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" fill="#173442">Centre (0, 0)</text><text x="360" y="719" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#173442">X and Y limits: −50 to +50 mm</text><rect x="830" y="210" width="400" height="400" fill="#e4f0f5" stroke="#173442" stroke-width="4"/><circle cx="1030" cy="410" r="60" fill="#fffdf7" stroke="#173442" stroke-width="4"/><line x1="785" y1="610" x2="930" y2="610" stroke="#b24732" stroke-width="3" /><line x1="830" y1="655" x2="830" y2="510" stroke="#b24732" stroke-width="3" /><text x="937" y="618" font-family="Arial,sans-serif" font-size="22" text-anchor="start" fill="#b24732">X</text><text x="824" y="498" font-family="Arial,sans-serif" font-size="22" text-anchor="start" fill="#b24732">Y</text><text x="1030" y="154" font-family="Arial,sans-serif" font-size="32" text-anchor="middle" fill="#173442">Corner origin</text><text x="1030" y="677" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" fill="#173442">Circle centre (50, 50)</text><text x="1030" y="719" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#173442">X and Y limits: 0 to 100 mm</text></svg>
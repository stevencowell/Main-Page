<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">Periodic patterns, shells, symbols and changing explanations</title><desc id="desc">The first 18 elements are aligned by atomic number, symbol, period and group. Explicit shell-occupancy comparisons, qualitative prediction, symbol-versus-formula examples and an evidence-refinement sequence complete the accepted teaching purpose.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#486581"/></marker><style>.t{font:700 44px Arial,sans-serif;fill:#102a43}.h{font:700 25px Arial,sans-serif;fill:#102a43}.b{font:400 21px Arial,sans-serif;fill:#243b53}.n{font:600 18px Arial,sans-serif;fill:#486581}.sm{font:600 15px Arial,sans-serif;fill:#486581}.xs{font:600 12px Arial,sans-serif;fill:#486581}.white{fill:#fff}.arrow{fill:none;stroke:#486581;stroke-width:5;marker-end:url(#arrow)}.leader{fill:none;stroke:#486581;stroke-width:3}.dash{fill:none;stroke:#486581;stroke-width:4;stroke-dasharray:13 10}.dasharrow{fill:none;stroke:#486581;stroke-width:4;stroke-dasharray:13 10;marker-end:url(#arrow)}</style></defs><rect width="1600" height="900" fill="#f7fafc"/><rect x="70" y="55" width="1460" height="88" rx="18" fill="#fff" stroke="#8a5a13" stroke-width="5"/><text x="800" y="111" class="t" text-anchor="middle">Periodic patterns, shells, symbols and changing explanations</text>
<rect x="70" y="170" width="730" height="590" rx="16" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="105" y="208" class="h" text-anchor="start">First 18 elements — periodic alignment</text><text x="142" y="255" class="xs" text-anchor="middle">G1</text><text x="219" y="255" class="xs" text-anchor="middle">G2</text><text x="296" y="255" class="xs" text-anchor="middle">G13</text><text x="373" y="255" class="xs" text-anchor="middle">G14</text><text x="450" y="255" class="xs" text-anchor="middle">G15</text><text x="527" y="255" class="xs" text-anchor="middle">G16</text><text x="604" y="255" class="xs" text-anchor="middle">G17</text><text x="681" y="255" class="xs" text-anchor="middle">G18</text><text x="88" y="307" class="xs" text-anchor="middle">P1</text><text x="88" y="377" class="xs" text-anchor="middle">P2</text><text x="88" y="447" class="xs" text-anchor="middle">P3</text><rect x="110" y="270" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="120" y="288" class="xs" text-anchor="start">1</text><text x="142" y="314" class="n" text-anchor="middle">H</text><rect x="649" y="270" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="659" y="288" class="xs" text-anchor="start">2</text><text x="681" y="314" class="n" text-anchor="middle">He</text><rect x="110" y="340" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="120" y="358" class="xs" text-anchor="start">3</text><text x="142" y="384" class="n" text-anchor="middle">Li</text><rect x="187" y="340" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="197" y="358" class="xs" text-anchor="start">4</text><text x="219" y="384" class="n" text-anchor="middle">Be</text><rect x="264" y="340" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="274" y="358" class="xs" text-anchor="start">5</text><text x="296" y="384" class="n" text-anchor="middle">B</text><rect x="341" y="340" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="351" y="358" class="xs" text-anchor="start">6</text><text x="373" y="384" class="n" text-anchor="middle">C</text><rect x="418" y="340" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="428" y="358" class="xs" text-anchor="start">7</text><text x="450" y="384" class="n" text-anchor="middle">N</text><rect x="495" y="340" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="505" y="358" class="xs" text-anchor="start">8</text><text x="527" y="384" class="n" text-anchor="middle">O</text><rect x="572" y="340" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="582" y="358" class="xs" text-anchor="start">9</text><text x="604" y="384" class="n" text-anchor="middle">F</text><rect x="649" y="340" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="659" y="358" class="xs" text-anchor="start">10</text><text x="681" y="384" class="n" text-anchor="middle">Ne</text><rect x="110" y="410" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="120" y="428" class="xs" text-anchor="start">11</text><text x="142" y="454" class="n" text-anchor="middle">Na</text><rect x="187" y="410" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="197" y="428" class="xs" text-anchor="start">12</text><text x="219" y="454" class="n" text-anchor="middle">Mg</text><rect x="264" y="410" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="274" y="428" class="xs" text-anchor="start">13</text><text x="296" y="454" class="n" text-anchor="middle">Al</text><rect x="341" y="410" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="351" y="428" class="xs" text-anchor="start">14</text><text x="373" y="454" class="n" text-anchor="middle">Si</text><rect x="418" y="410" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="428" y="428" class="xs" text-anchor="start">15</text><text x="450" y="454" class="n" text-anchor="middle">P</text><rect x="495" y="410" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="505" y="428" class="xs" text-anchor="start">16</text><text x="527" y="454" class="n" text-anchor="middle">S</text><rect x="572" y="410" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="582" y="428" class="xs" text-anchor="start">17</text><text x="604" y="454" class="n" text-anchor="middle">Cl</text><rect x="649" y="410" width="64" height="56" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="659" y="428" class="xs" text-anchor="start">18</text><text x="681" y="454" class="n" text-anchor="middle">Ar</text>
<rect x="100" y="500" width="670" height="94" rx="16" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="120" y="526" class="sm" text-anchor="start"><tspan x="120" dy="0">Legend: small number = atomic number • letters = correctly capitalised element symbol</tspan><tspan x="120" dy="25">P = period (row) • G = displayed group (column) • position shows periodic organisation</tspan></text>
<rect x="100" y="615" width="670" height="115" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="120" y="642" class="n" text-anchor="start">Qualitative pattern reasoning</text><text x="120" y="668" class="sm" text-anchor="start"><tspan x="120" dy="0">Similarities across rows or down groups can support cautious property or reactivity predictions.</tspan><tspan x="120" dy="23">Predictions require evidence; no ranking, numerical scale or guarantee is shown.</tspan></text>
<rect x="830" y="170" width="700" height="250" rx="16" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="865" y="208" class="h" text-anchor="start">Displayed simple electron-shell occupancy</text>
<text x="870" y="245" class="n" text-anchor="start">Across period 2</text><rect x="870" y="265" width="130" height="54" rx="16" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="935" y="288" class="n" text-anchor="middle">Li</text><text x="935" y="309" class="xs" text-anchor="middle">2,1 electrons</text><rect x="1020" y="265" width="130" height="54" rx="16" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="1085" y="288" class="n" text-anchor="middle">Be</text><text x="1085" y="309" class="xs" text-anchor="middle">2,2 electrons</text><rect x="1170" y="265" width="130" height="54" rx="16" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="1235" y="288" class="n" text-anchor="middle">C</text><text x="1235" y="309" class="xs" text-anchor="middle">2,4 electrons</text><rect x="1320" y="265" width="130" height="54" rx="16" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="1385" y="288" class="n" text-anchor="middle">Ne</text><text x="1385" y="309" class="xs" text-anchor="middle">2,8 electrons</text>
<text x="870" y="352" class="n" text-anchor="start">Down group 1</text><rect x="1030" y="330" width="130" height="54" rx="16" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="1095" y="353" class="n" text-anchor="middle">H</text><text x="1095" y="374" class="xs" text-anchor="middle">1</text><rect x="1180" y="330" width="130" height="54" rx="16" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="1245" y="353" class="n" text-anchor="middle">Li</text><text x="1245" y="374" class="xs" text-anchor="middle">2,1</text><rect x="1330" y="330" width="130" height="54" rx="16" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="1395" y="353" class="n" text-anchor="middle">Na</text><text x="1395" y="374" class="xs" text-anchor="middle">2,8,1</text><text x="870" y="405" class="sm" text-anchor="start">Comma-separated numbers show electrons in each occupied shell; no literal paths.</text>
<rect x="830" y="445" width="335" height="315" rx="16" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="860" y="482" class="h" text-anchor="start">Element symbols and formulas</text><rect x="865" y="515" width="265" height="70" rx="16" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="997" y="543" class="n" text-anchor="middle">H   O   Na   Cl</text><text x="997" y="569" class="sm" text-anchor="middle">individual element symbols</text><rect x="865" y="610" width="265" height="80" rx="16" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="997" y="640" class="n" text-anchor="middle">H₂O   NaCl</text><text x="997" y="666" class="sm" text-anchor="middle">simple formulas contain</text><text x="997" y="685" class="sm" text-anchor="middle">more than one element symbol</text><text x="997" y="725" class="sm" text-anchor="middle">Capitalisation and subscripts matter.</text>
<rect x="1190" y="445" width="340" height="315" rx="16" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="1220" y="482" class="h" text-anchor="start"><tspan x="1220" dy="0">Evidence drove changes</tspan><tspan x="1220" dy="29">in periodic organisation</tspan></text><rect x="1225" y="555" width="270" height="58" rx="16" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="1243" y="589" class="h" text-anchor="start">Observed patterns</text><text x="1243" y="620" class="sm" text-anchor="start"></text><line x1="1360" y1="615" x2="1360" y2="635" class="dasharrow"/><rect x="1225" y="640" width="270" height="58" rx="16" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="1243" y="674" class="h" text-anchor="start">Properties + atomic number</text><text x="1243" y="705" class="sm" text-anchor="start"></text><line x1="1360" y1="700" x2="1360" y2="720" class="dasharrow"/><text x="1360" y="745" class="sm" text-anchor="middle">refined organisation/explanation</text>
<text x="800" y="815" class="n" text-anchor="middle">Solid grid positions organise the first 18; dashed arrows show evidence-based refinement, not a reactivity scale.</text></svg>
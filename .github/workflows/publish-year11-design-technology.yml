name: Publish Year 11 Design and Technology

"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-year11-design-technology.yml
      - scripts/publish-year11-design-technology.py

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TAS main menu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install package downloader
        run: python -m pip install --quiet gdown

      - name: Download current Year 11 site package
        run: gdown 1RhAPqvNp5BWAOSfqtVRNArd21HTS8xMA -O /tmp/year11-design-technology-site.zip

      - name: Prepare course and main-menu entry
        run: python scripts/publish-year11-design-technology.py

      - name: Commit live course
        run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add index.html Year-11-Design-and-Technology && (git diff --cached --quiet || (git commit -m "Publish Year 11 Design and Technology course" && git push))

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc"><title id="title">Module 3 learning map</title><desc id="desc">Three connected sections for Research that informs design followed by an applied task and folio evidence.</desc><rect width="1100" height="390" rx="28" fill="#f8f2e7"/><rect x="55" y="70" width="300" height="155" rx="20" fill="#fff" stroke="#b9654a" stroke-width="4"/><circle cx="90" cy="105" r="22" fill="#b9654a"/><text x="90" y="113" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#fff">1</text><text x="125" y="100" font-family="Arial" font-size="21" font-weight="700" fill="#173a32">Primary and secondary</text><text x="125" y="126" font-family="Arial" font-size="21" font-weight="700" fill="#173a32">research</text><path d="M355 148H395" stroke="#7e9488" stroke-width="6" stroke-linecap="round"/><path d="M382 137l13 11-13 11" fill="none" stroke="#7e9488" stroke-width="5"/><rect x="405" y="70" width="300" height="155" rx="20" fill="#fff" stroke="#d6a85b" stroke-width="4"/><circle cx="440" cy="105" r="22" fill="#d6a85b"/><text x="440" y="113" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#fff">2</text><text x="475" y="100" font-family="Arial" font-size="21" font-weight="700" fill="#173a32">Qualitative and</text><text x="475" y="126" font-family="Arial" font-size="21" font-weight="700" fill="#173a32">quantitative data</text><path d="M705 148H745" stroke="#7e9488" stroke-width="6" stroke-linecap="round"/><path d="M732 137l13 11-13 11" fill="none" stroke="#7e9488" stroke-width="5"/><rect x="755" y="70" width="300" height="155" rx="20" fill="#fff" stroke="#547d69" stroke-width="4"/><circle cx="790" cy="105" r="22" fill="#547d69"/><text x="790" y="113" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#fff">3</text><text x="825" y="100" font-family="Arial" font-size="21" font-weight="700" fill="#173a32">Ethical research and</text><text x="825" y="126" font-family="Arial" font-size="21" font-weight="700" fill="#173a32">evidence synthesis</text><rect x="190" y="280" width="720" height="70" rx="18" fill="#173a32"/><text x="550" y="310" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#f7f0df">APPLY + KEEP EVIDENCE</text><text x="550" y="336" text-anchor="middle" font-family="Arial" font-size="17" fill="#fff">Prepare a research plan that combines methods, identifies participants and</text><text x="550" y="336" text-anchor="middle" font-family="Arial" font-size="17" fill="#fff">shows how findings will affect decisions.</text></svg>